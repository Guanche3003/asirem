services:
  - type: web
    name: asirem-api
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/public/site
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      # Plan gratuit : pas de disque persistant, la base est recréée à chaque déploiement.
      - key: DB_PATH
        value: ./data/crm.db
      - key: CORS_ORIGIN
        value: https://asirem.vercel.app
      - key: COOKIE_SAMESITE
        value: None
      - key: COOKIE_SECURE
        value: "1"
      - key: CRM_ADMIN_PASSWORD
        sync: false

# Pour conserver la base entre les déploiements, passer en plan payant :
#   plan: starter
# et ajouter :
#   disk:
#     name: asirem-data
#     mountPath: /data
#     sizeGB: 1
# avec DB_PATH: /data/crm.db
